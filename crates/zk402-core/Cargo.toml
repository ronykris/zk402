[package]
name = "zk402-core"
version = "0.1.1"
description = "Core types and traits for the zk402 zero-knowledge payment protocol"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["zero-knowledge", "payments", "zk-snark", "privacy", "blockchain"]
categories = ["cryptography", "web-programming"]
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
async-trait = "0.1"

