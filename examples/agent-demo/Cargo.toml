[package]
name = "agent-demo"
version = "0.1.0"
edition = "2021"

[workspace]
# This is a standalone example, not part of the workspace

[dependencies]
zk402-core = { path = "../../crates/zk402-core" }
zk402-prover = { path = "../../crates/zk402-prover" }
zk402-groth16 = { path = "../../crates/zk402-groth16" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
rand = "0.8"
hex = "0.4"

[[bin]]
name = "mock-services"
path = "src/mock_services.rs"

[[bin]]
name = "research-agent"
path = "src/research_agent.rs"
